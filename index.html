<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Text Decorator</title>
    <link rel="stylesheet" href="style.css">
    <!-- خطوط دعم Unicode -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>✨ Advanced Text Decorator</h1>
        
        <div class="toolbox">
            <textarea id="inputText" placeholder="Type text here..."></textarea>
            
            <div class="controls">
                <select id="styleSelect">
                    <option value="bold">Bold Style</option>
                    <option value="sans">Sans-Serif</option>
                    <option value="mono">Monospace</option>
                    <option value="double">Double-Struck</option>
                    <option value="circled">Circled</option>
                </select>
                
                <button id="transformBtn">Transform</button>
            </div>
            
            <div class="output-container">
                <div class="output-header">
                    <h3>Result:</h3>
                    <button id="copyBtn">Copy</button>
                </div>
                <div id="outputText" class="output-area"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

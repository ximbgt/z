<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Text Decorator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animation"></div> <div class="container">
        <h1>✨ Advanced Text Decorator</h1>
        
        <div class="toolbox">
            <textarea id="inputText" placeholder="اكتب نصك هنا..."></textarea>
            
            <div class="style-buttons">
                <button class="style-btn" data-style="bold">Bold Style</button>
                <button class="style-btn" data-style="sans">Sans-Serif</button>
                <button class="style-btn" data-style="mono">Monospace</button>
                <button class="style-btn" data-style="double">Double-Struck</button>
                <button class="style-btn" data-style="circled">Circled</button>
            </div>
            
            <div class="output-container">
                <div class="output-header">
                    <h3>النتيجة:</h3>
                    <button id="copyBtn">نسخ</button>
                </div>
                <div id="outputText" class="output-area"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

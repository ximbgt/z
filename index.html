<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Text Generator ✨</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-magic"></i> Fancy Text Generator</h1>
        
        <div class="input-group">
            <textarea id="inputText" placeholder="Type your text here..."></textarea>
            <div class="char-count"><span id="count">0</span> characters</div>
        </div>
        
        <div class="controls">
            <select id="styleSelect">
                <option value="bold">Bold Style</option>
                <option value="sans-serif">Sans-Serif</option>
                <option value="monospace">Monospace</option>
                <option value="double-struck">Double-Struck</option>
                <option value="circled">Circled</option>
            </select>
            
            <button id="generateBtn" onclick="decorateText()">
                <i class="fas fa-wand-magic-sparkles"></i> Generate
            </button>
        </div>
        
        <div class="output-container">
            <div class="output-header">
                <h3><i class="fas fa-star"></i> Fancy Result:</h3>
                <button id="copyBtn" onclick="copyToClipboard()">
                    <i class="far fa-copy"></i> Copy
                </button>
            </div>
            <div id="outputText"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
